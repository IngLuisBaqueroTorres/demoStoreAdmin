spring:
  application:
    name: demostore

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173

  datasource:
    url: jdbc:mysql://localhost:3306/store_db?useUnicode=true&characterEncoding=utf8
    username: root
    password: 1A2b3c4d!

  jpa:
    hibernate:
      ddl-auto: update # or create or update depending on your needs
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true

  jackson:
    serialization:
      INDENT_OUTPUT: true

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
# Google Auth
google:
  client:
    id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
